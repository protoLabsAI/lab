name: "RAG Quality Evaluation — Expanded"
description: "20 test cases across faithfulness, multi-document reasoning, domain-specific (homelab/DevOps), and edge cases"

tests:
  # ============================================================
  # FAITHFULNESS / GROUNDEDNESS (5 tests)
  # ============================================================

  - question: "What are the main causes of coral reef decline?"
    context: |
      A 2024 study by the Australian Institute of Marine Science found that
      rising sea surface temperatures are the primary driver of coral bleaching
      on the Great Barrier Reef, responsible for 62% of observed bleaching
      events between 2016 and 2024. Agricultural runoff containing nitrogen
      and phosphorus was the second largest factor at 23%, while crown-of-thorns
      starfish outbreaks accounted for 11%. The remaining 4% was attributed
      to localized storm damage. The study did not examine ocean acidification
      as a separate factor due to methodological constraints.
    expected_answer: "According to the study, the main causes are rising sea surface temperatures (62% of bleaching events), agricultural runoff with nitrogen and phosphorus (23%), crown-of-thorns starfish outbreaks (11%), and localized storm damage (4%). The study did not examine ocean acidification separately."
    metadata:
      category: faithfulness
      difficulty: medium
      tests: "Answer must ONLY use info from provided context, no external knowledge"

  - question: "What were the quarterly revenue figures for Northwind Electronics in fiscal year 2025?"
    context: |
      Northwind Electronics reported the following quarterly revenues for
      fiscal year 2025 (ending March 31, 2025):
        Q1 (Apr-Jun 2024): $142.7 million
        Q2 (Jul-Sep 2024): $158.3 million
        Q3 (Oct-Dec 2024): $201.9 million
        Q4 (Jan-Mar 2025): $187.4 million
      Total annual revenue was $690.3 million, a 14.2% increase over FY2024.
      The Q3 spike was attributed to strong holiday consumer electronics demand.
      Gross margin averaged 34.6% across all four quarters.
    expected_answer: "Northwind Electronics' FY2025 quarterly revenues were: Q1 $142.7M, Q2 $158.3M, Q3 $201.9M, Q4 $187.4M, totaling $690.3M (up 14.2% YoY). Q3 was the highest due to holiday demand."
    metadata:
      category: faithfulness
      difficulty: easy
      tests: "Context has specific numbers/dates — answer must preserve them exactly"

  - question: "Who developed the Orion and Gemini spacecraft?"
    context: |
      The Orion Multi-Purpose Crew Vehicle is developed by Lockheed Martin
      under contract to NASA. Its first uncrewed test flight, Artemis I,
      launched on November 16, 2022. The European Service Module that provides
      propulsion and life support for Orion is built by Airbus Defence and Space.
      The Gemini program ran from 1961 to 1966 and used spacecraft built by
      McDonnell Aircraft Corporation. Gemini missions carried two astronauts
      and tested orbital rendezvous techniques essential for the later Apollo
      missions. SpaceX's Gemini is an internal codename for a next-generation
      cargo routing system and is unrelated to NASA's Gemini program.
    expected_answer: "The Orion spacecraft is developed by Lockheed Martin (with the European Service Module by Airbus). The NASA Gemini spacecraft (1961-1966) was built by McDonnell Aircraft Corporation. SpaceX also uses 'Gemini' as an internal codename for a cargo routing system, but that is unrelated to the NASA program."
    metadata:
      category: faithfulness
      difficulty: hard
      tests: "Context has multiple entities — answer must not confuse attributions"

  - question: "Is remote work more productive than in-office work?"
    context: |
      A Stanford study led by Nicholas Bloom tracked 16,000 workers over
      9 months and found that remote workers were 13% more productive than
      their in-office counterparts, primarily due to fewer breaks and sick
      days. However, a 2024 meta-analysis published in the Journal of
      Organizational Behavior covering 78 studies found no statistically
      significant difference in productivity between remote and in-office
      workers (effect size d=0.04, p=0.31). The meta-analysis noted that
      results vary substantially by industry, role type, and how productivity
      is measured. A third study from Microsoft Research found that remote
      work increased asynchronous communication by 25% but reduced
      cross-team collaboration by 17%, making productivity comparisons
      context-dependent.
    expected_answer: "The evidence is mixed and context-dependent. One Stanford study found remote workers 13% more productive, but a larger 2024 meta-analysis of 78 studies found no statistically significant difference (p=0.31). Microsoft Research noted tradeoffs: remote work increases async communication but reduces cross-team collaboration. The answer depends on industry, role, and how productivity is measured."
    metadata:
      category: faithfulness
      difficulty: hard
      tests: "Context is ambiguous — answer should acknowledge ambiguity, not pick a side"

  - question: "What is the recommended dosage of metformin for type 2 diabetes?"
    context: |
      The James Webb Space Telescope (JWST) was launched on December 25, 2021,
      aboard an Ariane 5 rocket from Kourou, French Guiana. It orbits the
      Sun-Earth L2 Lagrange point, approximately 1.5 million kilometers from
      Earth. The telescope's primary mirror is 6.5 meters in diameter, composed
      of 18 gold-coated beryllium hexagonal segments. JWST observes in the
      infrared spectrum, from 0.6 to 28.3 micrometers, enabling it to see
      through dust clouds and observe the earliest galaxies in the universe.
    expected_answer: "The provided context is about the James Webb Space Telescope and does not contain any information about metformin or diabetes treatment. I cannot answer this question from the given context."
    metadata:
      category: faithfulness
      difficulty: easy
      tests: "Context is irrelevant to the question — model should say it cannot answer"

  # ============================================================
  # MULTI-DOCUMENT REASONING (5 tests)
  # ============================================================

  - question: "What is Kubernetes pod autoscaling and how do you configure it?"
    contexts:
      - |
        Kubernetes Horizontal Pod Autoscaler (HPA) automatically scales the
        number of pod replicas in a Deployment, ReplicaSet, or StatefulSet
        based on observed CPU utilization or custom metrics. The HPA controller
        checks metrics every 15 seconds by default (configurable via
        --horizontal-pod-autoscaler-sync-period). It uses the formula:
        desiredReplicas = ceil(currentReplicas * (currentMetric / targetMetric)).
      - |
        To create an HPA, use: kubectl autoscale deployment my-app --cpu-percent=50
        --min=2 --max=10. This sets a target CPU utilization of 50% with a
        minimum of 2 and maximum of 10 replicas. You can also define an HPA
        as a YAML manifest with apiVersion: autoscaling/v2, which supports
        multiple metrics including memory, custom metrics from Prometheus,
        and external metrics.
      - |
        Vertical Pod Autoscaler (VPA) adjusts CPU and memory requests for
        containers automatically. Unlike HPA which scales horizontally (more
        pods), VPA scales vertically (bigger pods). VPA has three modes:
        "Auto" applies recommendations and evicts pods, "Recreate" is similar
        but only updates on restart, and "Off" only generates recommendations
        without applying them. VPA and HPA should not target the same CPU
        metric simultaneously to avoid conflicts.
    expected_answer: "Kubernetes supports two types of pod autoscaling. HPA (Horizontal Pod Autoscaler) adds or removes pod replicas based on CPU, memory, or custom metrics, checking every 15 seconds. Configure it with 'kubectl autoscale' or a YAML manifest (autoscaling/v2). VPA (Vertical Pod Autoscaler) adjusts CPU/memory requests per container in Auto, Recreate, or Off modes. Avoid using both HPA and VPA on the same CPU metric to prevent conflicts."
    metadata:
      category: multi_document
      difficulty: medium
      tests: "3 documents with complementary info — synthesize into complete answer"

  - question: "What is the expected lifespan of an SSD under normal use?"
    contexts:
      - |
        Samsung's whitepaper on the 990 PRO NVMe SSD states an endurance
        rating of 600 TBW (terabytes written) for the 1TB model, with a
        Mean Time Between Failures (MTBF) of 1.5 million hours. Samsung
        estimates this translates to approximately 5-7 years of normal
        consumer use, assuming 100-150 GB of writes per day. The NAND flash
        cells are rated for 1,500 program-erase cycles.
      - |
        A 2024 Backblaze reliability report covering 250,000 drives found
        that SSDs in their data center environment had an annualized failure
        rate (AFR) of 1.05% after 4 years, compared to 1.83% for HDDs. The
        report noted that SSDs showed lower failure rates in years 1-3 but
        the gap narrowed by year 5. Backblaze cautioned that their workload
        (continuous reads, moderate writes for boot drives) may not represent
        typical consumer or enterprise write-heavy scenarios, and that 10+
        year lifespan estimates from manufacturers remain unproven at scale.
    expected_answer: "The expected lifespan depends on workload and varies by source. Samsung rates the 990 PRO at 600 TBW / 1.5M hours MTBF, estimating 5-7 years at typical consumer write levels. However, Backblaze's large-scale data center study found SSD failure rates around 1.05% AFR after 4 years, but cautioned that manufacturer claims of 10+ year lifespans are unproven at scale and results depend heavily on workload type."
    metadata:
      category: multi_document
      difficulty: hard
      tests: "2 documents that contradict each other — answer should note the disagreement"

  - question: "What is the default isolation level in PostgreSQL?"
    contexts:
      - |
        Redis is an in-memory data structure store commonly used as a cache,
        message broker, and session store. It supports strings, hashes, lists,
        sets, and sorted sets. Redis persistence options include RDB snapshots
        and AOF (Append Only File) logging. By default, Redis saves an RDB
        snapshot every 60 seconds if at least 1000 keys changed.
      - |
        PostgreSQL uses Multi-Version Concurrency Control (MVCC) to handle
        concurrent access. The default transaction isolation level is Read
        Committed, meaning each statement within a transaction sees a snapshot
        of the database as of the start of that statement. PostgreSQL also
        supports Repeatable Read and Serializable isolation levels, which
        provide stronger consistency guarantees at the cost of potential
        serialization failures that require application-level retry logic.
      - |
        MongoDB supports multi-document ACID transactions starting from
        version 4.0 for replica sets and 4.2 for sharded clusters. The
        default read concern is "local" and the default write concern is
        "majority" in MongoDB 5.0+. Transactions have a default lifetime
        of 60 seconds before automatic abort.
      - |
        SQLite uses a file-level locking mechanism with five lock states:
        UNLOCKED, SHARED, RESERVED, PENDING, and EXCLUSIVE. Its default
        journal mode is "delete" but WAL (Write-Ahead Logging) mode is
        recommended for concurrent read/write workloads. SQLite's default
        isolation level is Serializable.
    expected_answer: "The default isolation level in PostgreSQL is Read Committed. Under this level, each statement in a transaction sees a snapshot of the database as of the start of that statement. PostgreSQL also supports Repeatable Read and Serializable for stronger consistency, though these may require retry logic for serialization failures."
    metadata:
      category: multi_document
      difficulty: medium
      tests: "4 documents where only 1 is relevant — answer should use only the relevant one"

  - question: "What are the system requirements for running Stable Diffusion locally?"
    contexts:
      - |
        The official Stable Diffusion documentation recommends a GPU with at
        least 8 GB VRAM for generating 512x512 images. An NVIDIA GPU with
        CUDA support is strongly recommended. The model weights for SD 1.5
        require approximately 4 GB of disk space, while SDXL requires about
        6.5 GB. System RAM of 16 GB or more is recommended. Python 3.10+
        is required, along with PyTorch 2.0 or later compiled with CUDA support.
      - |
        Community benchmarks on the Stable Diffusion subreddit show that GPUs
        with 8 GB VRAM (like the RTX 3060 Ti or RTX 4060) can generate 512x512
        images in about 5-8 seconds per image. GPUs with 12+ GB VRAM (RTX 3060 12GB,
        RTX 4070) can handle 1024x1024 SDXL generation. Users report that 16 GB
        system RAM is the practical minimum, with 32 GB recommended if running
        other applications alongside. An SSD is strongly recommended over HDD
        for model loading times — loading from HDD takes 45-60 seconds vs
        3-5 seconds from NVMe SSD.
      - |
        For Apple Silicon Macs, Stable Diffusion can run via the MLX framework
        or Core ML optimized models. An M1 with 16 GB unified memory can
        generate 512x512 images in about 15-20 seconds. M2 Pro/Max chips
        with 32+ GB are recommended for SDXL. Python 3.10+ and the
        diffusers library from HuggingFace are required. Note that MPS
        (Metal Performance Shaders) backend has some operator limitations
        compared to CUDA.
    expected_answer: "To run Stable Diffusion locally, you need: a GPU with at least 8 GB VRAM (NVIDIA with CUDA recommended, or Apple Silicon via MLX/CoreML), 16 GB system RAM minimum (32 GB recommended), Python 3.10+, and PyTorch 2.0+ with CUDA. Disk space is 4 GB for SD 1.5 or 6.5 GB for SDXL, and an SSD is strongly recommended (3-5s load vs 45-60s on HDD). For SDXL at 1024x1024, 12+ GB VRAM is needed. Apple Silicon M1 with 16 GB can run SD 1.5 but M2 Pro/Max with 32 GB is recommended for SDXL."
    metadata:
      category: multi_document
      difficulty: medium
      tests: "3 documents with overlapping info — answer should deduplicate"

  - question: "What HTTP methods does the payments API support for refunds?"
    contexts:
      - |
        ## Payments API — Refunds

        Supported operations:
        - POST /v2/refunds — Create a new refund
        - GET /v2/refunds/{id} — Retrieve refund status
        - GET /v2/refunds — List refunds (supports pagination)

        Required headers: Authorization: Bearer {token}, Content-Type: application/json
      - |
        The payments API refund endpoint accepts POST requests to create refunds
        and GET requests to retrieve them. To create a refund, send a POST to
        /v2/refunds with a JSON body containing payment_id (required), amount
        (optional, defaults to full refund), and reason (optional, string).
        The response includes a refund_id, status (pending/completed/failed),
        and created_at timestamp. Refunds typically process within 5-10
        business days. There is no DELETE endpoint — refunds cannot be cancelled
        once submitted.
      - |
        | Endpoint | Method | Description | Rate Limit |
        |----------|--------|-------------|------------|
        | /v2/refunds | POST | Create refund | 100/min |
        | /v2/refunds/{id} | GET | Get refund | 500/min |
        | /v2/refunds | GET | List refunds | 200/min |
        | /v2/refunds/{id} | PATCH | Update reason | 100/min |
    expected_answer: "The payments API supports POST (create refund, 100/min limit), GET (retrieve single refund or list with pagination, 200-500/min), and PATCH (update refund reason, 100/min) for the /v2/refunds endpoints. There is no DELETE endpoint — refunds cannot be cancelled once submitted. POST requires payment_id in the body; amount and reason are optional."
    metadata:
      category: multi_document
      difficulty: medium
      tests: "Documents in different formats (bullets, prose, table) — answer should normalize"

  # ============================================================
  # DOMAIN-SPECIFIC — HOMELAB / DEVOPS (5 tests)
  # ============================================================

  - question: "How do I set up Tailscale subnet routing on a Proxmox node?"
    context: |
      Tailscale Subnet Router Configuration for Proxmox

      1. Install Tailscale on the Proxmox host:
         curl -fsSL https://tailscale.com/install.sh | sh

      2. Enable IP forwarding (required for subnet routing):
         echo 'net.ipv4.ip_forward = 1' >> /etc/sysctl.d/99-tailscale.conf
         echo 'net.ipv6.conf.all.forwarding = 1' >> /etc/sysctl.d/99-tailscale.conf
         sysctl -p /etc/sysctl.d/99-tailscale.conf

      3. Authenticate and advertise routes:
         tailscale up --advertise-routes=10.10.0.0/24,10.10.1.0/24 --accept-dns=false

         Replace the CIDR ranges with your Proxmox VM/container subnets.
         Use --accept-dns=false to avoid overriding Proxmox's DNS config.

      4. Approve the routes in the Tailscale admin console:
         Go to https://login.tailscale.com/admin/machines
         Find the Proxmox node, click "..." > "Edit route settings"
         Toggle on the advertised subnets.

      5. On client devices, enable the subnet routes:
         tailscale up --accept-routes

      Firewall note: If using Proxmox's built-in firewall, add rules to
      allow traffic on the tailscale0 interface. In /etc/pve/firewall/cluster.fw:
         [RULES]
         IN ACCEPT -i tailscale0
         OUT ACCEPT -o tailscale0

      Persistence: Tailscale survives reboots via its systemd service. The
      IP forwarding sysctl settings persist via the conf file. No additional
      cron jobs or startup scripts are needed.
    expected_answer: "Install Tailscale (curl installer), enable IPv4/IPv6 forwarding in sysctl, then run 'tailscale up --advertise-routes=<your-subnets> --accept-dns=false'. Approve the routes in the Tailscale admin console under the machine's route settings. On clients, use 'tailscale up --accept-routes'. If using Proxmox's firewall, add ACCEPT rules for the tailscale0 interface. Everything persists across reboots via systemd and sysctl conf files."
    metadata:
      category: domain_specific
      difficulty: medium
      tests: "Given server config docs, answer 'how do I set up X?'"

