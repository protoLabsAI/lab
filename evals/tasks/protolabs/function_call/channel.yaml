# protoLabs fleet eval — function call channel reliability
# Tests whether tool calls land in the structured tool_calls field
# vs being emitted as text in content (the gina issue #1 failure mode).
#
# Graded DETERMINISTICALLY (graders/tool_channel.py): an LLM judge reading
# serialized output cannot tell a structured tool_call from text and mislabels
# correct tool-sourced answers as hallucinations. The channel is a property of
# the trace (finish_reason / message.tool_calls), so we check it directly.

id: fc_channel
name: "Function Call Channel Reliability"
category: protolabs
difficulty: medium

system_prompt: |
  You are a helpful assistant. When a user's request can be fulfilled by a tool,
  you MUST use the tool via a function call. Never write tool calls as text in your
  response — always use the structured tool calling mechanism.

tests:
  - id: pfc_001_simple_tool
    prompt: "What time is it?"
    tools:
      - type: function
        function:
          name: current_time
          description: "Get the current date and time"
          parameters:
            type: object
            properties: {}
    mock_tool_responses:
      current_time: '{"datetime": "2026-04-27T10:30:00-05:00", "timezone": "America/Chicago"}'
    expected:
      tools: [current_time]
    graders:
      - type: tool_channel
        dimension: channel_correctness

  - id: pfc_002_tool_with_args
    prompt: "Search the web for 'vLLM Blackwell GPU support'"
    tools:
      - type: function
        function:
          name: web_search
          description: "Search the web for information"
          parameters:
            type: object
            properties:
              query:
                type: string
                description: "Search query"
            required: ["query"]
    mock_tool_responses:
      web_search: '{"results": [{"title": "vLLM 0.8.0 adds Blackwell support", "url": "https://blog.vllm.ai", "snippet": "Full CUDA 12.8 support for RTX PRO 6000 Blackwell GPUs"}]}'
    expected:
      tools: [web_search]
      args:
        web_search:
          query: "blackwell"
    graders:
      - type: tool_channel
        dimension: channel_correctness

  - id: pfc_003_multi_tool_selection
    prompt: "What's 234 * 567 and what time is it?"
    tools:
      - type: function
        function:
          name: calculator
          description: "Perform arithmetic calculations"
          parameters:
            type: object
            properties:
              expression:
                type: string
            required: ["expression"]
      - type: function
        function:
          name: current_time
          description: "Get current date/time"
          parameters:
            type: object
            properties: {}
      - type: function
        function:
          name: web_search
          description: "Search the web"
          parameters:
            type: object
            properties:
              query:
                type: string
            required: ["query"]
    mock_tool_responses:
      calculator: '{"result": 132678}'
      current_time: '{"datetime": "2026-04-27T10:30:00-05:00"}'
    expected:
      tools: [calculator, current_time]
    graders:
      - type: tool_channel
        dimension: channel_correctness

  - id: pfc_004_tool_with_complex_args
    prompt: "Send an email to sarah@company.com about the GPU benchmark results. Subject: 'Benchmark Complete'. Body should mention 27B won quality and 35B won speed."
    tools:
      - type: function
        function:
          name: gmail_send_message
          description: "Send an email message"
          parameters:
            type: object
            properties:
              to:
                type: string
                description: "Recipient email address"
              subject:
                type: string
                description: "Email subject line"
              body:
                type: string
                description: "Email body text"
            required: ["to", "subject", "body"]
      - type: function
        function:
          name: gmail_draft
          description: "Save an email draft"
          parameters:
            type: object
            properties:
              to:
                type: string
              subject:
                type: string
              body:
                type: string
            required: ["to", "subject", "body"]
    mock_tool_responses:
      gmail_send_message: '{"status": "sent", "message_id": "msg_abc123"}'
    expected:
      tools: [gmail_send_message]
      forbidden_tools: [gmail_draft]
      args:
        gmail_send_message:
          to: "sarah@company.com"
          body: ["27B", "35B"]
    graders:
      - type: tool_channel
        dimension: channel_correctness

  - id: pfc_005_no_tool_needed
    prompt: "Thanks, that's all I needed!"
    tools:
      - type: function
        function:
          name: current_time
          description: "Get current date/time"
          parameters:
            type: object
            properties: {}
      - type: function
        function:
          name: calculator
          description: "Math calculations"
          parameters:
            type: object
            properties:
              expression:
                type: string
            required: ["expression"]
      - type: function
        function:
          name: web_search
          description: "Search the web"
          parameters:
            type: object
            properties:
              query:
                type: string
            required: ["query"]
    expected:
      no_tool: true
    graders:
      - type: tool_channel
        dimension: channel_correctness
