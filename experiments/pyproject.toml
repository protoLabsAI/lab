[project]
name = "lab-experiments"
version = "0.1.0"
description = "ML experiments on Blackwell GPUs — loose scripts, fast iteration"
requires-python = ">=3.12"
dependencies = [
    "lab-core",
    "torch>=2.9",
    "gradio>=5.0",
    "transformers",
    "accelerate",
    "diffusers>=0.38",
    "scipy",
    "huggingface_hub",
    "peft>=0.17.1",
    "opencv-python-headless",
    "soundfile",
    "kokoro>=0.9",
]

[tool.ruff.lint]
select = ["F"]  # Loose — just catch errors, no style enforcement

[tool.uv.sources]
lab-core = { workspace = true }
torch = { index = "pytorch-cu128" }
