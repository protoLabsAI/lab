# Quick Model Evaluation Profile
# ~15 min, 1 trial — fast smoke test across all domains
# Usage: ./run.sh profile --name quick --model local

name: "Quick Smoke Test"
description: "Fast cross-domain evaluation for new models. 1 trial, ~30 tests."
trials: 1

# Claw-eval agent tasks — 6 tasks covering different tool patterns
claw:
  tasks: "T02,T04,T06,T08,T10_contact_lookup,T14"
  port_offset: 200
  # T02: email triage (classification + tool use)
  # T04: calendar scheduling (multi-step planning)
  # T06: email reply draft (generation + tool use)
  # T08: todo management (complex multi-tool orchestration)
  # T10: contact lookup (search + disambiguation)
  # T14: meeting notes (summarization + extraction)

# Custom suites — 1 representative test per domain
custom:
  - suite: coding
    # Both generation.yaml (5 tests) and analysis.yaml (5 tests)
  - suite: instruction_following
  - suite: reasoning
  - suite: structured_output
  - suite: summarization
  - suite: safety

# Function calling
function_call:
  suites: ["basic", "edge_cases"]
