id: reasoning_v2_arith
name: Reasoning v2 — arith (solver-verified, seed 20260702)
category: reasoning
tests:
- id: v2_arith_0_easy
  prompt: 'A warehouse starts the week with 83 bins, 63 pallets, and 43 crates. An order ships out 10
    bins. A supplier drops off 26 pallets. A supplier invoice for 36 crates arrives (not yet delivered).
    21 pallets are consolidated into 21 bins (the pallets leave stock). 28 pallets are consolidated into
    28 bins (the pallets leave stock).


    How many bins does the warehouse have at the end?


    Work through this step by step, then give your final answer on the last line in exactly this format:

    ANSWER: <answer>'
  graders:
  - type: match
    dimension: reasoning_exact
    mode: number
    expected: 122
    tolerance: 0
  ground_truth: 122
  difficulty: easy
- id: v2_arith_1_easy
  prompt: 'A warehouse starts the week with 131 cartons, 112 pallets, and 54 drums. 5 cartons are inspected
    and returned to the same shelf. An order ships out 19 cartons. 13 cartons are repacked: their contents
    now count as 13 pallets (the cartons leave stock). 8 pallets are consolidated into 8 cartons (the
    pallets leave stock). 9 cartons are repacked: their contents now count as 9 pallets (the cartons leave
    stock).


    How many cartons does the warehouse have at the end?


    Work through this step by step, then give your final answer on the last line in exactly this format:

    ANSWER: <answer>'
  graders:
  - type: match
    dimension: reasoning_exact
    mode: number
    expected: 98
    tolerance: 0
  ground_truth: 98
  difficulty: easy
- id: v2_arith_2_medium
  prompt: 'A warehouse starts the week with 108 crates, 134 drums, and 32 cartons. A customer pickup removes
    8 drums. 3 drums are consolidated into 3 crates (the drums leave stock). A customer pickup removes
    23 drums. A quote is requested for 5 additional cartons. A supplier invoice for 30 cartons arrives
    (not yet delivered). A customer pickup removes 15 drums. An order ships out 15 crates. An audit finds
    9 miscounted crates and adds them back to the ledger. The site manager notes 8 cartons were repainted.
    An audit finds 8 miscounted crates and adds them back to the ledger. 28 drums are consolidated into
    28 crates (the drums leave stock). 21 cartons are moved between aisles within the warehouse. A delivery
    adds 10 crates. A customer pickup removes 23 drums.


    How many crates and how many drums does the warehouse have at the end? Work through this step by step,
    then give your final answer on the last line in exactly this format:

    ANSWER: crates=<n>, drums=<n>'
  graders:
  - type: match
    dimension: count_a
    mode: regex
    expected: crates\s*=\s*151\b
    case_sensitive: false
  - type: match
    dimension: count_b
    mode: regex
    expected: drums\s*=\s*34\b
    case_sensitive: false
  ground_truth: crates=151, drums=34
  difficulty: medium
- id: v2_arith_3_hard
  prompt: 'A warehouse starts the week with 92 sacks, 80 crates, and 43 drums. 25 sacks are repacked:
    their contents now count as 25 crates (the sacks leave stock). A customer pickup removes 22 crates.
    20 sacks are repacked: their contents now count as 20 crates (the sacks leave stock). A delivery adds
    9 sacks. A customer pickup removes 14 crates. A quote is requested for 7 additional drums. A supplier
    drops off 15 crates. An order ships out 15 sacks. A quote is requested for 34 additional drums. 36
    sacks are inspected and returned to the same shelf. 5 crates are consolidated into 5 sacks (the crates
    leave stock). 17 sacks are inspected and returned to the same shelf. 34 sacks are inspected and returned
    to the same shelf. An audit finds 6 miscounted sacks and adds them back to the ledger. The site manager
    notes 33 drums were repainted. The site manager notes 10 drums were repainted. 24 sacks are inspected
    and returned to the same shelf. A delivery adds 22 sacks. An audit finds 8 miscounted sacks and adds
    them back to the ledger. An order ships out 25 sacks. A supplier drops off 27 crates. A supplier drops
    off 24 crates. A supplier drops off 22 crates. 6 sacks are repacked: their contents now count as 6
    crates (the sacks leave stock).


    How many sacks and how many crates does the warehouse have at the end? Work through this step by step,
    then give your final answer on the last line in exactly this format:

    ANSWER: sacks=<n>, crates=<n>'
  graders:
  - type: match
    dimension: count_a
    mode: regex
    expected: sacks\s*=\s*51\b
    case_sensitive: false
  - type: match
    dimension: count_b
    mode: regex
    expected: crates\s*=\s*178\b
    case_sensitive: false
  ground_truth: sacks=51, crates=178
  difficulty: hard
