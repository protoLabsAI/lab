      - type: llm_judge
        dimension: coherence
        rubric: |
          Score the quality of the user-facing language:
          1.0 = clear, non-technical descriptions a product user would understand, consistent tone
          0.75 = mostly user-friendly but 1-2 items are too technical
          0.5 = mix of user-friendly and developer-speak
          0.25 = reads like raw commit messages
          0.0 = incomprehensible to a non-developer

  - id: tech_007
    prompt: |
      Translate the following technical specification into an executive summary suitable for
      a non-technical VP. Keep it to one paragraph (4-6 sentences). Replace all jargon with
      plain language. Preserve the key business implications.

      ## Technical Specification: Real-Time Fraud Detection Pipeline v2

      ### Architecture
      Migrating from batch-oriented ETL (daily Spark jobs processing T-1 transaction data in
      S3) to a real-time streaming architecture using Apache Kafka for event ingestion, Apache
      Flink for stream processing, and Redis for feature store caching. Transaction events will
      be published to Kafka topics with exactly-once semantics via the transactional producer API.
      Flink jobs will consume these events, enrich them with customer behavioral features from
      Redis (rolling 30-day aggregates updated in real-time), and score them against an XGBoost
      model served via a gRPC endpoint with p99 latency under 15ms.

      ### Key Metrics
      - Current system: fraud detection latency = 18-24 hours (next-day batch)
      - Proposed system: fraud detection latency = sub-200ms (real-time)
      - Expected false positive reduction: 35% (due to real-time behavioral context)
      - Expected fraud catch rate improvement: from 62% to 89% (due to eliminating T-1 gap)
      - Infrastructure cost increase: $14,000/month (+40% over current batch infrastructure)
      - Implementation timeline: 10 weeks (4 dev + 3 testing + 3 gradual rollout)

      ### Risk Mitigation
      - Dual-running old and new systems for 3 weeks during rollout (canary deployment)
      - Automatic fallback to batch pipeline if streaming latency exceeds 500ms for >5 minutes
      - Model versioning via MLflow with A/B testing capability for gradual model updates
      - All Kafka topics configured with 7-day retention for replay capability
    graders:
      - type: llm_judge
        dimension: correctness
        rubric: |
          Executive summary must convey these business points in plain language:
          1. What: upgrading fraud detection from next-day to real-time (sub-second)
          2. Impact: catch 89% of fraud vs 62% today, 35% fewer false alarms
          3. Cost: $14K/month more (+40%)
          4. Timeline: 10 weeks including testing and gradual rollout
          5. Safety: old system runs alongside new one during transition, automatic fallback

          Must NOT contain unexplained jargon: Kafka, Flink, Redis, ETL, S3, Spark, gRPC,
          XGBoost, MLflow, p99, exactly-once semantics, feature store, canary deployment

          1.0 = all 5 business points covered, zero unexplained jargon, 4-6 sentences, VP would understand
          0.75 = covers 4 points and mostly jargon-free (1 technical term slips through)
          0.5 = covers 3 points or multiple jargon terms remain
          0.25 = too technical for a VP audience
          0.0 = still reads like a technical spec
      - type: llm_judge
        dimension: coherence
        rubric: |
          Score readability for a non-technical executive:
          1.0 = reads as a natural, persuasive business paragraph; a VP could make a decision from it
          0.75 = clear but slightly dry or stilted
          0.5 = understandable but feels like a translated spec rather than a business communication
          0.25 = confusing or poorly organized
          0.0 = incomprehensible to a non-technical reader
