model:
  pretrained_llm: Qwen/Qwen3.5-4B
  pretrained_asr: nvidia/canary-1b-flash

  pretrained_weights: True

  freeze_params:
    - "^llm\\..+$"
    - "^embed_tokens\\..+$"
    - "^perception\\.preprocessor\\..+$"
    - "^perception\\.encoder\\..+$"
  prevent_freeze_params: []

  prompt_format: qwen
  audio_locator_tag: "<|audioplaceholder|>"

  # v3: Q-Former adapter with 64 query vectors + multi-layer weighted sum
  # Replaces v2's IdentityConnector for richer audio→LLM mapping (DeSTA2 style)
  perception:
    target: nemo.collections.speechlm2.modules.perception.AudioPerceptionModule
    output_dim: 2560  # Qwen3.5-4B hidden dim
    # NOTE: NeMo's salm.py training_step was patched to handle encoder_multilayer
    # (the upstream code only checks .encoder which doesn't exist in Q-Former mode)
    modality_adapter:
      _target_: nemo.collections.speechlm2.modules.perception.QformerConnector
      prompt_size: 64
      target_layer_ids: [0, 5, 11, 17, 23]  # DeSTA2.5-style multi-layer aggregation
      qformer_num_hidden_layers: 6
      encoder_config:
        d_model: 1024  # Canary encoder dim
        encoder_attention_heads: 8
      llm_config:
        hidden_size: 2560

  optimizer:
    _target_: torch.optim.AdamW
    lr: 1e-4              # v3: was 5e-4, dropped to DeSTA2 default
    betas: [0.9, 0.98]
    weight_decay: 1e-3
    foreach: true

  lr_scheduler:
    _target_: nemo.core.optim.lr_scheduler.CosineAnnealing
    warmup_steps: 2000    # v3: was 500, increased to DeSTA2 value
    min_lr: 1e-6
    max_steps: ${trainer.max_steps}

trainer:
  devices: [0, 1]
  accelerator: gpu
  num_nodes: 1
  precision: bf16-true
  logger: False
  enable_checkpointing: False
  use_distributed_sampler: False
  max_steps: 67000
  limit_train_batches: 5000
  val_check_interval: ${trainer.limit_train_batches}
  limit_val_batches: 10
  log_every_n_steps: 10
  num_sanity_val_steps: 1
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  strategy:
    _target_: lightning.pytorch.strategies.DDPStrategy
    gradient_as_bucket_view: true
    find_unused_parameters: true

data:
  train_ds:
    sample_rate: 16000
    prompt_format: ${model.prompt_format}
    token_equivalent_duration: 0.08
    input_cfg:
      - type: lhotse_as_conversation
        cuts_path: /mnt/data/salm-duplex/manifests/full-960h-described/train.jsonl.gz
        audio_locator_tag: ${model.audio_locator_tag}
        tags:
          context: "Describe what you hear in this audio."
    seed: 42
    shuffle: true
    shard_seed: "randomized"
    num_workers: 2
    batch_size: 4

  validation_ds:
    prompt_format: ${model.prompt_format}
    token_equivalent_duration: 0.08
    datasets:
      librispeech_val:
        input_cfg:
          - type: lhotse_as_conversation
            cuts_path: /mnt/data/salm-duplex/manifests/full-960h-described/val.jsonl.gz
            audio_locator_tag: ${model.audio_locator_tag}
            tags:
              context: "Describe what you hear in this audio."
    sample_rate: 16000
    batch_size: 1
    seed: 42
    shard_seed: "randomized"

exp_manager:
  exp_dir: null
  explicit_log_dir: /mnt/data/training/salm-qwen4b-v3/
  name: salm-qwen4b-v3
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  use_datetime_version: true
  max_time_per_run: 00:14:00:00

  resume_if_exists: false  # v3 starts fresh
  resume_ignore_no_checkpoint: true

  checkpoint_callback_params:
    filename: "{step}"
    monitor: val_loss
    mode: min
    every_n_train_steps: 5000
    every_n_epochs: 0
    save_top_k: 3
    always_save_nemo: false
    save_nemo_on_train_end: false  # avoid the save_to error from v2
