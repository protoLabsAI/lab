# Claw-Eval config — 27B with thinking enabled (no preserve)
# A/B baseline: thinking without preserve_thinking

model:
  api_key: ${GATEWAY_API_KEY}
  base_url: http://localhost:8000/v1
  model_id: local
  extra_body:
    chat_template_kwargs:
      enable_thinking: true

judge:
  api_key: not-needed
  base_url: http://localhost:8002/v1
  model_id: local-fast
  enabled: true
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
    logit_bias:
      "248068": -100  # suppress <think>
      "248069": -100  # suppress </think>

defaults:
  trace_dir: ../results
  tasks_dir: claw-eval/tasks
