  - question: "What is the maximum concurrent connection limit for the WebSocket gateway?"
    context: |
      The Proto-Labs WebSocket Gateway is a high-performance message routing
      layer built on top of the uWebSockets library. It handles real-time
      bidirectional communication between client applications and backend
      microservices. The gateway supports automatic reconnection with
      exponential backoff, starting at 500ms and capping at 30 seconds.
      Messages are serialized using MessagePack for bandwidth efficiency,
      with an average message size of 127 bytes compared to 340 bytes for
      equivalent JSON payloads. The gateway runs as a cluster of Node.js
      worker processes, one per CPU core, behind an HAProxy layer that
      handles TLS termination and sticky sessions based on the client's
      connection ID. Health checks run every 10 seconds on the /healthz
      endpoint. The gateway publishes metrics to Prometheus including
      message throughput, latency percentiles, connection counts, and
      error rates. In production, the gateway typically handles between
      2,000 and 5,000 active connections during peak hours. Memory usage
      averages 450 MB per worker process, with each worker maintaining
      its own connection pool to Redis for pub/sub message distribution.
      Redis is configured with a maxmemory of 2 GB and eviction policy
      allkeys-lru. The authentication flow requires clients to send a
      JWT token in the initial WebSocket upgrade request, which the
      gateway validates against the auth service before establishing the
      connection. Tokens expire after 24 hours and clients must
      reconnect with a fresh token. Rate limiting is applied at 100
      messages per second per connection. For group messaging, the
      gateway supports rooms with a maximum of 500 members per room.
      The gateway was originally deployed in March 2024 and has maintained
      99.97% uptime since launch. During a load test conducted in January
      2025, the cluster successfully handled 47,000 simultaneous
      connections across 8 worker processes before hitting the configured
      maximum concurrent connection limit of 50,000 per cluster. Beyond
      this threshold, new connections receive a 503 Service Unavailable
      response with a Retry-After header. The load test also revealed
      that message latency p99 increased from 12ms to 89ms at 45,000
      connections, prompting an optimization of the Redis pub/sub
      fan-out pattern that reduced p99 to 34ms at the same load. Client
      libraries are available for JavaScript/TypeScript, Python, Go,
      and Rust. The Python client requires Python 3.9+ and uses asyncio
      for non-blocking I/O. Each client library implements the same
      retry logic and MessagePack serialization. The gateway supports
      protocol versioning through the Sec-WebSocket-Protocol header,
      currently serving v2 and v3 simultaneously with v1 deprecated
      since September 2024. Binary message support was added in v3,
      enabling efficient transfer of small files up to 1 MB. Messages
      larger than 1 MB are rejected with error code 1009. Logging uses
      structured JSON format sent to a Loki instance for aggregation
      and search. Alert rules are configured in Grafana for connection
      spike detection (>40,000 in 5 minutes), error rate threshold
      (>1% of messages), and worker process crashes.
    expected_answer: "The maximum concurrent connection limit is 50,000 per cluster. Beyond that, new connections receive a 503 Service Unavailable with a Retry-After header. This was confirmed in a January 2025 load test that reached 47,000 connections across 8 workers."
