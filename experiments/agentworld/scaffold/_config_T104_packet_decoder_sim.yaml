defaults:
  tasks_dir: ../../../evals/claw/claw-eval/tasks
  trace_dir: traces
judge:
  api_key: ${GATEWAY_API_KEY}
  base_url: http://ava:4000/v1
  model_id: protolabs/fast
model:
  api_key: ${GATEWAY_API_KEY}
  base_url: http://ava:4000/v1
  extra_body:
    chat_template_kwargs:
      enable_thinking: true
    max_tokens: 10000
  model_id: protolabs/smart
  system_prompt_prefix: "## Scaffold: Binary Protocol Parser\n\n### 1. Decomposition\n\
    1. Read spec document; extract frame format (marker, fields, lengths, endianness,\
    \ checksum algorithm).\n2. Inspect binary capture: size, byte distribution, marker\
    \ frequency, structural regularity.\n3. Resolve ambiguities by cross-referencing\
    \ spec claims against observed byte patterns (e.g., does checksum field match\
    \ spec algorithm?).\n4. Implement parser: scan for markers, parse fixed header,\
    \ extract variable payload, validate checksum.\n5. Emit one JSON object per frame\
    \ to JSONL.\n\n### 2. Tool-Call Workflow\n- **First**: Read spec file fully (may\
    \ be sparse or misleading).\n- **Then**: `ls -la` fixtures; confirm capture.bin\
    \ exists and has non-zero size. If missing, check for alternative data sources\
    \ (test_data.json, setup scripts).\n- **Inspect binary**: Use `od`/`hexdump` to\
    \ sample first 200 bytes and scan for marker byte frequency. Look for repeating\
    \ patterns indicating frame boundaries.\n- **Validate checksum hypothesis**: Compute\
    \ candidate checksums (SHA1[0], sum mod 256, XOR, CRC8) over observed frames;\
    \ check which matches the trailing byte.\n- **Code**: Write parser incrementally;\
    \ test against known-good bytes from spec examples if available.\n\n### 3. Failure\
    \ Modes + Recovery\n- **Missing capture.bin**: Check alternate paths, generate\
    \ from test fixtures, or produce empty output with warning.\n- **Spec says SHA1\
    \ but field is 1 byte**: Try truncation strategies (first byte, last byte, byte\
    \ 10). If none work, reconsider: maybe it's not SHA1 at all \u2014 test simple\
    \ sums/XORs.\n- **Length field ambiguity** (payload-only vs. payload+checksum):\
    \ Try both; the one producing valid checksums wins.\n- **Malformed/truncated trailing\
    \ frame**: Parse greedily, mark as error, don't abort.\n- **Overlapping frames**:\
    \ Prefer longest valid parse at each marker position.\n\n### 4. Verification\n\
    - Run parser; confirm every line in JSONL is valid JSON.\n- Spot-check first 3\
    \ frames manually against hex dump.\n- Verify checksum validity rate is high (>90%)\
    \ \u2014 low rate indicates wrong algorithm.\n- Confirm no frames skipped: total\
    \ parsed bytes \u2248 file size (minus trailing garbage).\n- Ensure JSONL has\
    \ no trailing newline issues; each line terminates with `\\n`."
