  - question: "How do I authenticate with the Infisical API to retrieve secrets?"
    context: |
      Infisical API Authentication — Machine Identity (v0.46+)

      Machine Identity is the recommended auth method for server-to-server
      secret retrieval. It replaces the older Service Token method (deprecated
      in v0.42).

      Step 1: Create a Machine Identity in the Infisical dashboard.
        - Go to Organization Settings > Machine Identities > Create
        - Name it (e.g., "ava-ai-prod")
        - Select "Universal Auth" as the authentication method
        - Note the Client ID and Client Secret

      Step 2: Authenticate and obtain an access token.
        POST https://secrets.proto-labs.ai/api/v1/auth/universal-auth/login
        Content-Type: application/json

        {
          "clientId": "your-client-id",
          "clientSecret": "your-client-secret"
        }

        Response:
        {
          "accessToken": "eyJhbG...",
          "expiresIn": 7200,
          "tokenType": "Bearer"
        }

      Step 3: Use the access token to fetch secrets.
        GET https://secrets.proto-labs.ai/api/v3/secrets/raw?environment=prod&workspaceId=<project-id>&secretPath=/
        Authorization: Bearer eyJhbG...

        Response contains an array of { secretKey, secretValue } objects.

      Token refresh: Access tokens expire after 2 hours (7200s). Re-call
      the login endpoint to get a new token. There is no refresh token flow.

      Rate limits: 120 requests/minute per Machine Identity.
    expected_answer: "Create a Machine Identity in Infisical with Universal Auth, note the Client ID and Client Secret. POST to /api/v1/auth/universal-auth/login with those credentials to get a Bearer access token (expires in 2 hours). Then use that token in the Authorization header to GET secrets from /api/v3/secrets/raw with environment, workspaceId, and secretPath parameters. Re-authenticate when the token expires — there is no refresh token flow. Rate limit is 120 req/min."
    metadata:
      category: domain_specific
      difficulty: medium
      tests: "Given API docs, answer 'how do I authenticate?'"

  - question: "What services does this Docker Compose stack run and how are they connected?"
    context: |
      # docker-compose.yml
      version: "3.8"
      services:
        traefik:
          image: traefik:v3.0
          ports:
            - "80:80"
            - "443:443"
            - "8080:8080"
          volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - ./traefik/config:/etc/traefik
            - ./traefik/certs:/certs
          networks:
            - web
          restart: unless-stopped

        gitea:
          image: gitea/gitea:1.22
          environment:
            - GITEA__database__DB_TYPE=postgres
            - GITEA__database__HOST=db:5432
            - GITEA__database__NAME=gitea
            - GITEA__database__USER=gitea
            - GITEA__database__PASSWD=${GITEA_DB_PASS}
          volumes:
            - gitea_data:/data
          labels:
            - "traefik.http.routers.gitea.rule=Host(`git.proto-labs.ai`)"
            - "traefik.http.services.gitea.loadbalancer.server.port=3000"
          depends_on:
            - db
          networks:
            - web
            - internal
          restart: unless-stopped

        drone:
          image: drone/drone:2
          environment:
            - DRONE_GITEA_SERVER=http://gitea:3000
            - DRONE_GITEA_CLIENT_ID=${DRONE_GITEA_ID}
            - DRONE_GITEA_CLIENT_SECRET=${DRONE_GITEA_SECRET}
            - DRONE_SERVER_HOST=ci.proto-labs.ai
            - DRONE_SERVER_PROTO=https
            - DRONE_DATABASE_DRIVER=postgres
            - DRONE_DATABASE_DATASOURCE=postgres://drone:${DRONE_DB_PASS}@db:5432/drone?sslmode=disable
          labels:
            - "traefik.http.routers.drone.rule=Host(`ci.proto-labs.ai`)"
            - "traefik.http.services.drone.loadbalancer.server.port=80"
          depends_on:
            - gitea
            - db
          networks:
            - web
            - internal
          restart: unless-stopped

        db:
          image: postgres:16-alpine
          environment:
            - POSTGRES_MULTIPLE_DATABASES=gitea,drone
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=${POSTGRES_PASS}
          volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh
          networks:
            - internal
          restart: unless-stopped

      volumes:
        gitea_data:
        postgres_data:

      networks:
        web:
        internal:
    expected_answer: "This stack runs 4 services: Traefik (reverse proxy on ports 80/443/8080), Gitea (Git server at git.proto-labs.ai), Drone CI (at ci.proto-labs.ai, integrated with Gitea for source code), and PostgreSQL 16 (shared database). Gitea and Drone both depend on the Postgres database (separate databases initialized via init script). Drone connects to Gitea internally over HTTP. Traefik routes external HTTPS traffic to Gitea (port 3000) and Drone (port 80) based on hostname. Two networks isolate traffic: 'web' for Traefik-facing services and 'internal' for database connections."
    metadata:
      category: domain_specific
      difficulty: medium
      tests: "Given Dockerfile and compose file, answer 'what services does this run?'"

  - question: "How do I create a ZFS mirror pool and set up automatic snapshots?"
    context: |
      $ zpool create --help
      usage: zpool create [-fnd] [-o property=value] ... [-O file-system-property=value] ...
             [-m mountpoint] [-R root] pool vdev ...

      Create a new storage pool with the given name and vdev specification.

        -f    Force creation, even if devices are in use
        -n    Dry run — display config without creating
        -d    Do not enable any features by default
        -o    Set pool property (e.g., -o ashift=12)
        -O    Set filesystem property (e.g., -O compression=lz4)
        -m    Set mountpoint (default: /poolname)
        -R    Set altroot for pool

      vdev types:
        mirror    Two or more devices in a mirror (n-way redundancy)
        raidz     RAID-Z with single parity (raidz1), double (raidz2), triple (raidz3)
        spare     Hot spare device
        log       ZIL log device (for sync writes)
        cache     L2ARC cache device (for reads)

      Example:
        zpool create -o ashift=12 -O compression=lz4 tank mirror /dev/sda /dev/sdb

      $ zfs-auto-snapshot --help
      Usage: zfs-auto-snapshot [options] [-l label] [-k keep] pool/dataset

      Automatically create and rotate ZFS snapshots.

        -l label   Snapshot label: frequent, hourly, daily, weekly, monthly
        -k keep    Number of snapshots to retain per label
        -r         Recurse into child datasets
        --prefix   Snapshot name prefix (default: zfs-auto-snap)
        --default-exclude  Exclude datasets unless com.sun:auto-snapshot=true

      Typically installed as cron jobs:
