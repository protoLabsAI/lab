# Claw-Eval config — 27B with preserve_thinking enabled
# A/B test: thinking + preserve_thinking vs thinking-only baseline

model:
  api_key: ${GATEWAY_API_KEY}
  base_url: http://localhost:8000/v1
  model_id: local
  extra_body:
    chat_template_kwargs:
      enable_thinking: true
      preserve_thinking: true

judge:
  api_key: ${GATEWAY_API_KEY}
  base_url: http://ava:4000/v1
  model_id: protolabs/fast  # 35B heretic via gateway — logit_bias baked in
  enabled: true

defaults:
  trace_dir: ../results
  tasks_dir: claw-eval/tasks
