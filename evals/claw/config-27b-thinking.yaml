# Claw-Eval config — 27B with thinking enabled (no preserve)
# A/B baseline: thinking without preserve_thinking

model:
  api_key: ${GATEWAY_API_KEY}
  base_url: http://localhost:8000/v1
  model_id: local
  extra_body:
    chat_template_kwargs:
      enable_thinking: true

judge:
  api_key: ${GATEWAY_API_KEY}
  base_url: http://ava:4000/v1
  model_id: protolabs/fast  # 35B heretic via gateway — logit_bias baked in
  enabled: true

defaults:
  trace_dir: ../results
  tasks_dir: claw-eval/tasks
