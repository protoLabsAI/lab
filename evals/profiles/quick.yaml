# Quick Model Evaluation Profile
# ~20 min, 1 trial — fast smoke test across all domains
# Usage: ./run.sh profile --name quick --model local

name: "Quick Smoke Test"
description: "Fast cross-domain evaluation for new models. 1 trial, ~60+ tests."
trials: 1

# Claw-eval agent tasks — 10 tasks, deterministic slice across categories
claw:
  tasks: "T02,T04,T06,T08,T10_contact_lookup,T14,T18,T24,T28,T38"
  port_offset: 200
  # Core agentic:
  #   T02: email triage (classification + tool use)
  #   T04: calendar scheduling (multi-step planning)
  #   T06: email reply draft (generation + tool use)
  #   T08: todo management (complex multi-tool orchestration)
  #   T10: contact lookup (search + disambiguation)
  # Business ops:
  #   T14: meeting notes (summarization + extraction)
  #   T18: ticket triage (prioritization + routing)
  #   T24: crm data export (structured data + formatting)
  # Technical:
  #   T28: api config audit (technical analysis)
  #   T38: incident postmortem (complex multi-source reasoning)

# Custom suites
custom:
  - suite: coding
  - suite: instruction_following
  - suite: reasoning
  - suite: structured_output
  - suite: summarization
  - suite: safety
  - suite: creative_writing
  - suite: roleplay
  - suite: protolabs/tool_reliability
  - suite: protolabs/voice
  - suite: protolabs/function_call
  - suite: protolabs/routing

# Function calling (canary suite has gate enforcement via alias_tiers.yaml)
function_call:
  suites: ["basic", "edge_cases", "canary", "gina_tools", "gina_advanced"]
