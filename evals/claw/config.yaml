# Claw-Eval config — protoLabs gateway integration
# Runs eval tasks against our LiteLLM gateway (local or remote)

model:
  api_key: ${GATEWAY_API_KEY}
  base_url: http://ava:4000/v1
  model_id: local  # vLLM model behind gateway
  extra_body:
    # TEMP (2026-06-26 Ornith eval): thinking ON. Ornith is a reasoning model
    # whose agentic/coding ability is the think-then-act loop; its published claw
    # numbers are thinking-on, and thinking-off demonstrably made it fumble tool
    # formatting on coding tasks. Daily-driver 27B is also run thinking-on this
    # session for a fair head-to-head. RESTORE to false (lab default) after.
    chat_template_kwargs:
      enable_thinking: true
    # Per-turn generation cap. Thinking-on with NO cap let Ornith-9B spiral to
    # ~48k tokens (80 tok/s × 600s task timeout) on a hard coding task, scoring 0.
    # 10k bounds a runaway turn to ~2min so the agent gets more turns instead of
    # burning the whole task timeout on one think-loop. Normal turns use <1-4k.
    max_tokens: 10000

judge:
  api_key: ${GATEWAY_API_KEY}
  base_url: http://ava:4000/v1
  model_id: protolabs/fast  # 35B heretic via gateway — logit_bias + sampling baked in there
  enabled: true

defaults:
  trace_dir: ../results
  tasks_dir: claw-eval/tasks
