id: reasoning_v2_grid
name: Reasoning v2 — grid (solver-verified, seed 20260702)
category: reasoning
tests:
- id: v2_grid_0_easy
  prompt: 'There are 3 houses in a row, positions 1 (leftmost) to 3 (rightmost). Each house has a distinct
    color, and each is occupied by a different person with a distinct drink.


    - Alice lives immediately to the left of Bob.

    - Alice lives in the first (leftmost) house.

    - The person in the red house drinks milk.

    - The milk drinker lives in house 1.

    - The tea drinker lives in house 2.

    - Bob lives in the green house.


    Determine, for every person, their house number, house color, and drink. Work through this step by
    step, then give your final answer on the last line as a comma-separated list in exactly this per-person
    format (no spaces inside a person''s entry):

    ANSWER: Alice=h<pos>,<color>,<drink>; Bob=h<pos>,<color>,<drink>; ...'
  graders:
  - type: match
    dimension: grid_full
    mode: all_of
    expected: &id001
    - Alice=h1,red,milk
    - Bob=h2,green,tea
    - Carol=h3,blue,coffee
    case_sensitive: false
  ground_truth: *id001
  difficulty: easy
