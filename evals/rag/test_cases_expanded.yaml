  - question: "What backup strategy does the team use for their production databases?"
    context: |
      Our production infrastructure runs on three PostgreSQL 16 clusters in
      an active-passive configuration. The primary cluster handles all write
      operations and streams WAL (Write-Ahead Log) segments to two standby
      nodes using synchronous replication with a maximum lag tolerance of
      100ms. Each database is approximately 340 GB in size.

      For backups, we use pgBackRest configured with full backups every
      Sunday at 02:00 UTC and incremental backups every 6 hours. Full
      backups are retained for 30 days and incrementals for 14 days.
      Backups are stored in an S3-compatible bucket (MinIO cluster on
      pve01) with server-side AES-256 encryption. We verified restore
      time is approximately 45 minutes for a full restore from the most
      recent backup.

      WAL archiving is continuous to the same S3 bucket, enabling
      point-in-time recovery (PITR) to any moment within the 14-day
      window. We have not yet implemented cross-region backup replication
      or tested disaster recovery for a scenario where both the primary
      database and the MinIO cluster fail simultaneously.
    expected_answer: "The team uses pgBackRest with full backups every Sunday at 02:00 UTC and incremental backups every 6 hours. Retention is 30 days for full and 14 days for incremental backups, stored in S3-compatible MinIO with AES-256 encryption. Continuous WAL archiving enables point-in-time recovery within 14 days, and full restore takes about 45 minutes. However, there are gaps: cross-region backup replication is not yet implemented, and disaster recovery for simultaneous primary database and MinIO failure has not been tested."
