# protoLabs AI Node — Prometheus scrape targets
# These targets are for the ava-ai (Blackwell) node.
# Add to your Prometheus config on the monitoring server.

scrape_configs:
  # ─── System metrics ──────────────────────────────────────────────
  - job_name: node-protolabs
    static_configs:
      - targets: ["100.109.43.57:9100"]
        labels:
          node: protolabs

  - job_name: cadvisor-protolabs
    static_configs:
      - targets: ["100.109.43.57:8080"]
        labels:
          node: protolabs

  - job_name: gpu-protolabs
    static_configs:
      - targets: ["100.109.43.57:9835"]
        labels:
          node: protolabs

  # ─── AI services ─────────────────────────────────────────────────
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["100.109.43.57:8000"]
        labels:
          app: vllm
          node: protolabs

  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["100.109.43.57:4000"]
        labels:
          app: gateway
          node: protolabs

  - job_name: protoclaw
    metrics_path: /metrics
    static_configs:
      - targets: ["100.109.43.57:7865"]
        labels:
          app: protoclaw
          node: protolabs
