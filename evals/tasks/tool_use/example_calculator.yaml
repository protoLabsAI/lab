# Example custom eval task — calculator tool use
# Tests: Does the agent use the calculator tool correctly?

id: tool_use_001
name: "Basic Calculator"
difficulty: simple
category: tool_use

system_prompt: |
  You are a helpful assistant with access to a calculator tool.
  Always use the calculator for arithmetic — never compute in your head.

prompt: |
  What is 847 * 293 + 1456?

tools:
  - type: function
    function:
      name: calculator
      description: "Perform arithmetic calculations"
      parameters:
        type: object
        properties:
          expression:
            type: string
            description: "Math expression to evaluate"
        required: ["expression"]

mock_tool_responses:
  calculator: '{"result": 249527}'

expected:
  answer: "249527"
  tool_used: true

graders:
  - type: llm_judge
    dimension: correctness
    rubric: |
      Score whether the agent's final answer contains the correct result: 249527.
      1.0 = correct answer clearly stated
      0.5 = partially correct or unclear
      0.0 = wrong answer or no answer
  - type: llm_judge
    dimension: tool_usage
    rubric: |
      Score whether the agent used the calculator tool instead of computing mentally.
      1.0 = used calculator tool
      0.0 = computed without tool
