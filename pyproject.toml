[project]
name = "lab"
version = "0.1.0"
description = "protoLabs AI Lab — models, evals, training, and infrastructure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepeval>=3.9.2",
    "ragas>=0.4.3",
]

[tool.uv.workspace]
members = [
    "packages/lab-core",
    "evals",
    "experiments",
    "models",
    "training",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
    "lab-core",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
lab-core = { workspace = true }
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["packages/lab-core/tests", "evals/tests"]
