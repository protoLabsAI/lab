# Claw-Eval config — heretic FP8 direct (GPU 1, port 8002)
# Bypasses gateway — hits vLLM directly for eval

model:
  api_key: not-needed
  base_url: http://localhost:8002/v1
  model_id: local-fast
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
    logit_bias:
      "248068": -100  # suppress <think>
      "248069": -100  # suppress </think>

judge:
  api_key: ${GATEWAY_API_KEY}
  base_url: http://ava:4000/v1
  model_id: claude-sonnet-4-6
  enabled: true

defaults:
  trace_dir: ../results
  tasks_dir: claw-eval/tasks
