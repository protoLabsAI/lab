defaults:
  tasks_dir: ../../../evals/claw/claw-eval/tasks
  trace_dir: traces
judge:
  api_key: ${GATEWAY_API_KEY}
  base_url: http://ava:4000/v1
  model_id: protolabs/fast
model:
  api_key: ${GATEWAY_API_KEY}
  base_url: http://ava:4000/v1
  extra_body:
    chat_template_kwargs:
      enable_thinking: true
    max_tokens: 10000
  model_id: protolabs/smart
  system_prompt_prefix: "### Scaffold: Binary Encoder Reverse-Engineering\n\n**1.\
    \ Decomposition**\n1.  **Analyze Decoder**: Parse `decoder.py` to map input byte\
    \ patterns to output characters/sequences. Identify the encoding scheme (e.g.,\
    \ Huffman, custom bit-packing, lookup table).\n2.  **Analyze Target**: Compute\
    \ target size and content statistics to estimate minimum encoded size.\n3.  **Construct\
    \ Payload**: Generate binary data that, when decoded, yields the target. If the\
    \ scheme is reversible, invert the algorithm. If complex, use constraint solving\
    \ or brute-force search with pruning.\n4.  **Verify Size**: Ensure encoded size\
    \ \u2264 60% of target size. If not, optimize encoding efficiency or check for\
    \ redundant patterns.\n5.  **Test**: Run decoder with encoded file and compare\
    \ output to target.\n\n**2. Tool-Call Workflow**\n-   **Read** `decoder.py` fully.\
    \ Use `cat` or text editor. Trace logic for edge cases.\n-   **Read** `target.txt`.\
    \ Use `cat` or `wc -c` for size.\n-   **Write** `encoded.dat` using Python script\
    \ or binary editor.\n-   **Execute** `python decoder.py < encoded.dat` and capture\
    \ stdout.\n-   **Compare** output with `target.txt` using `diff` or `cmp`.\n\n\
    **3. Failure Modes + Recovery**\n-   **Decoding Error**: Output differs from target.\
    \ Re-examine decoder logic for off-by-one, endianness, or stateful errors. Add\
    \ debug prints to decoder temporarily.\n-   **Size Exceeded**: Encoded file too\
    \ large. Check if encoding is optimal. Look for unused bits or redundant markers.\
    \ Consider alternative encoding strategies if allowed.\n-   **Ambiguous Encoding**:\
    \ Multiple inputs map to same output. Ensure chosen input is valid and minimal.\n\
    \n**4. Verification**\n-   **Exact Match**: Use `diff <(python decoder.py < encoded.dat)\
    \ target.txt` \u2014 must return no output.\n-   **Size Check**: `wc -c encoded.dat`\
    \ and `wc -c target.txt`. Confirm ratio \u2264 0.6.\n-   **Reproducibility**:\
    \ Run test multiple times to ensure no randomness or environment dependency."
