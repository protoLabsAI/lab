id: reasoning_v2_schedule
name: Reasoning v2 — schedule (solver-verified, seed 20260702)
category: reasoning
tests:
- id: v2_schedule_0_easy
  prompt: '4 colleagues each give one presentation on a distinct day, Mon through Thu.


    - Bob presents earlier in the week than Dan.

    - At least 2 days separate Carol and Bob (in some order).

    - Dan presents on the day right after Carol.


    Determine the unique schedule. Give your final answer on the last line in exactly this format (comma-separated,
    no spaces around ''=''):

    ANSWER: Alice=<day>, Bob=<day>, ...'
  graders:
  - type: match
    dimension: reasoning_exact
    mode: all_of
    expected: &id001
    - Alice=Tue
    - Bob=Mon
    - Carol=Wed
    - Dan=Thu
    case_sensitive: false
  ground_truth: *id001
  difficulty: easy
