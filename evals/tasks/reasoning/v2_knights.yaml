id: reasoning_v2_knights
name: Reasoning v2 — knights (solver-verified, seed 20260702)
category: reasoning
tests:
- id: v2_knights_0_easy
  prompt: 'On an island, knights always tell the truth and knaves always lie. You meet 3 inhabitants:
    Alice, Bob, Carol.


    - Carol says: "Alice is a knave."

    - Alice says: "Bob is a knave."

    - Bob says: "At least one of Carol and Alice is a knave."


    Determine what each inhabitant is. Give your final answer on the last line in exactly this format
    (comma-separated, no spaces around ''=''):

    ANSWER: Alice=<knight|knave>, Bob=<knight|knave>, ...'
  graders:
  - type: match
    dimension: reasoning_exact
    mode: all_of
    expected: &id001
    - Alice=knave
    - Bob=knight
    - Carol=knight
    case_sensitive: false
  ground_truth: *id001
  difficulty: easy
