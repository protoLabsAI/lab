# protoLabs AI Gateway — LiteLLM Proxy config
# Docs: https://docs.litellm.ai/docs/proxy/configs

model_list:
  # ─── Local: vLLM ──────────────────────────────────────────────────
  # Maps "local" to vLLM. All vLLM configs use --served-model-name local
  # so the model name is stable regardless of which model is loaded.
  - model_name: local
    litellm_params:
      model: openai/local
      api_base: http://host.docker.internal:8000/v1
      api_key: os.environ/VLLM_API_KEY

  # ─── Remote: Ollama on ava (Tailscale) ────────────────────────────
  - model_name: ava-ollama
    litellm_params:
      model: ollama/qwen3.5:9b
      api_base: http://ava:11434

  # ─── Anthropic (Claude) ────────────────────────────────────────────
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-opus-4-6
    litellm_params:
      model: anthropic/claude-opus-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet-4-0
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # ─── OpenAI ────────────────────────────────────────────────────────
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: o3
    litellm_params:
      model: openai/o3
      api_key: os.environ/OPENAI_API_KEY
      drop_params: true

  - model_name: gpt-5.4
    litellm_params:
      model: openai/gpt-5.4
      api_key: os.environ/OPENAI_API_KEY
      drop_params: true

  - model_name: gpt-5.4-mini
    litellm_params:
      model: openai/gpt-5.4-mini
      api_key: os.environ/OPENAI_API_KEY
      drop_params: true

  - model_name: gpt-5.4-nano
    litellm_params:
      model: openai/gpt-5.4-nano
      api_key: os.environ/OPENAI_API_KEY
      drop_params: true

  # ─── Google Gemini ─────────────────────────────────────────────────
  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3.1-pro
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3-flash
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3.1-flash-lite
    litellm_params:
      model: gemini/gemini-3.1-flash-lite-preview
      api_key: os.environ/GEMINI_API_KEY

  # ─── Groq (fast inference) ────────────────────────────────────────
  - model_name: groq-llama-70b
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  - model_name: groq-llama-8b
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: os.environ/GROQ_API_KEY

  # ─── xAI (Grok via OpenRouter) ─────────────────────────────────────
  - model_name: grok-3
    litellm_params:
      model: openrouter/x-ai/grok-3
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: grok-3-mini
    litellm_params:
      model: openrouter/x-ai/grok-3-mini
      api_key: os.environ/OPENROUTER_API_KEY

  # ─── OpenRouter ────────────────────────────────────────────────────
  - model_name: minimax-m2.5
    litellm_params:
      model: openrouter/minimax/minimax-m2.5
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: step-3.5-flash
    litellm_params:
      model: openrouter/stepfun/step-3.5-flash
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: deepseek-v3.2
    litellm_params:
      model: openrouter/deepseek/deepseek-v3.2
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: glm-5-turbo
    litellm_params:
      model: openrouter/z-ai/glm-5-turbo
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: kimi-k2.5
    litellm_params:
      model: openrouter/moonshotai/kimi-k2.5
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: gpt-oss-120b
    litellm_params:
      model: openrouter/openai/gpt-oss-120b
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: gpt-oss-20b
    litellm_params:
      model: openrouter/openai/gpt-oss-20b
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: mimo-v2-flash
    litellm_params:
      model: openrouter/xiaomi/mimo-v2-flash
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: grok-4.1-fast
    litellm_params:
      model: openrouter/x-ai/grok-4.1-fast
      api_key: os.environ/OPENROUTER_API_KEY

litellm_settings:
  # Langfuse tracing (auto-enabled when LANGFUSE_* keys are set)
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]

  # Request settings
  request_timeout: 600
  num_retries: 2
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
