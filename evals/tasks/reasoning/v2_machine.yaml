    SWP R2 R1   (swap R2 and R1)

    MOV R0 R2   (R0 = R2)

    ADD R0 R2   (R0 = R0 + R2)

    ADD R0 R1   (R0 = R0 + R1)


    What is the final value of R0?


    Work through this step by step, then give your final answer on the last line in exactly this format:

