[project]
name = "lab-core"
version = "0.1.0"
description = "Shared Pydantic models and utilities for protoLabs AI Lab"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_core"]
