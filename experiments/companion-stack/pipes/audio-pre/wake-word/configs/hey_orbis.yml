## Training config for "hey orbis" wake word model
## Uses Fish Audio S2 Pro for synthetic data (not Piper TTS)
## See scripts/generate_clips.py for the custom generation pipeline

model_name: "hey_orbis"

target_phrase:
  - "hey orbis"

# Phrases we do NOT want the model to activate on
custom_negative_phrases:
  - "hey orbit"
  - "hey gorgeous"
  - "a orbis"
  - "hey boris"
  - "hey or"
  - "hey orbits"
  - "hey norse"
  - "hey office"
  - "hey august"
  - "hey ardis"

# Synthetic data counts (generated by Fish Audio, not Piper)
n_samples: 5000
n_samples_val: 1000

# Piper stub (train.py imports unconditionally — we skip --generate_clips)
piper_sample_generator_path: "/mnt/data/training/wake-word/piper-stub"
tts_batch_size: 50

# Output directory (on NVMe for fast training I/O)
output_dir: "/mnt/data/training/wake-word/output"

# Augmentation
augmentation_batch_size: 16
augmentation_rounds: 2

# Room impulse responses for reverb simulation
rir_paths:
  - "/mnt/data/training/wake-word/mit_rirs/16khz"

# Background noise (empty list — augmentation uses RIR + synthetic noise only)
# AudioSet/FMA not available as HF datasets; openWakeWord adds colored noise natively
background_paths: []

background_paths_duplication_rate: []

# Pre-computed negative features (~2000 hours from ACAV100M)
false_positive_validation_data_path: "/mnt/data/training/wake-word/validation_set_features.npy"

feature_data_files:
  "ACAV100M_sample": "/mnt/data/training/wake-word/openwakeword_features_ACAV100M_2000_hrs_16bit.npy"

# Batch composition per class
batch_n_per_class:
  "ACAV100M_sample": 1024
  "adversarial_negative": 50
  "positive": 50

# Model architecture
model_type: "dnn"
layer_size: 32

# Training parameters
steps: 50000
max_negative_weight: 1500
target_false_positives_per_hour: 0.2
