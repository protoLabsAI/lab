[project]
name = "protolabs-evals"
version = "0.1.0"
description = "Agent evaluation suite for protoLabs AI platform"
requires-python = ">=3.12"
dependencies = [
    "lab-core",
    "langfuse>=3.0",
    "openai>=1.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "click>=8.0",
]

[project.optional-dependencies]
claw = ["fastapi>=0.115", "uvicorn>=0.30", "docker>=7.0", "trafilatura>=1.8"]
inspect = ["inspect-ai>=0.3"]

[project.scripts]
proto-eval = "runners.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graders", "runners"]

[tool.setuptools.packages.find]
include = ["graders*", "runners*", "tasks*"]

[tool.uv.sources]
lab-core = { workspace = true }
