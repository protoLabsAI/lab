# Full Model Evaluation Profile
# ~90-120 min, 3 trials — comprehensive evaluation for model selection
# Usage: ./run.sh profile --name full --model local

name: "Full Evaluation"
description: "Comprehensive cross-domain evaluation. 3 trials, pass^3 scoring, all suites."
trials: 3

# Claw-eval agent tasks — 30 tasks, deterministic slice across all categories
claw:
  tasks: "T02,T04,T06,T08,T10_contact_lookup,T12,T14,T16,T18,T20,T22,T24,T26,T28,T30,T32,T34,T36,T38,T40,T42,T44,T46,T48,T50,T86,T87,T88,T93,T99"
  port_offset: 200
  # Core agentic (T02-T10): email, calendar, drafts, todo, contacts
  # Business ops (T12-T24): expenses, meeting notes, kb, tickets, inventory, newsletter, crm
  # Complex reasoning (T26-T40): ambiguous contacts, api audit, cross-service, escalation,
  #                               ops dashboard, procurement, postmortem, onboarding
  # Research & analysis (T42-T50): scheduled tasks, outage research, cve, oss comparison, regulatory
  # Pinbench (T86-T99): calendar creation, market brief, project bootstrap, email triage, recall

# All custom suites — full runs
custom:
  - suite: coding
  - suite: instruction_following
  - suite: reasoning
  - suite: structured_output
  - suite: summarization
  - suite: safety
  - suite: creative_writing
  - suite: roleplay
  - suite: svg_generation
  - suite: research
  - suite: protolabs/tool_reliability
  - suite: protolabs/vision
  - suite: protolabs/voice
  - suite: protolabs/uncensored
  - suite: protolabs/function_call
  - suite: protolabs/routing

# Function calling — all suites
function_call:
  suites: ["basic", "edge_cases"]

