# Claw-Eval config — protoLabs gateway integration
# Runs eval tasks against our LiteLLM gateway (local or remote)

model:
  api_key: ${GATEWAY_API_KEY}
  base_url: http://localhost:4000/v1
  model_id: local  # vLLM model behind gateway

judge:
  api_key: ${GATEWAY_API_KEY}
  base_url: http://localhost:4000/v1
  model_id: claude-sonnet-4-6  # cloud model for judging
  enabled: true

defaults:
  trace_dir: ../results
  tasks_dir: claw-eval/tasks
