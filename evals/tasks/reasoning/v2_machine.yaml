id: reasoning_v2_machine
name: Reasoning v2 — machine (solver-verified, seed 20260702)
category: reasoning
tests:
- id: v2_machine_0_easy
  prompt: 'Execute this register program by hand, instruction by instruction.

    Note: ''mod 100'' is the mathematical modulo — the result is always in 0..99 even for negative inputs
    (e.g. (-7) mod 100 = 93).


    Registers start at R0=4, R1=3, R2=9.

    SUB R2 R0   (R2 = R2 - R0)

    SWP R2 R1   (swap R2 and R1)

    SUB R1 R2   (R1 = R1 - R2)

    MULMOD R1 R2   (R1 = (R1 * R2) mod 100)

    MOV R2 R1   (R2 = R1)

    SWP R0 R1   (swap R0 and R1)


    What is the final value of R2?


    Work through this step by step, then give your final answer on the last line in exactly this format:

    ANSWER: <answer>'
  graders:
  - type: match
    dimension: reasoning_exact
    mode: number
    expected: 6
    tolerance: 0
  ground_truth: 6
  difficulty: easy
