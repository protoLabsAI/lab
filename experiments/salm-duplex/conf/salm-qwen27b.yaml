model:
  pretrained_llm: Qwen/Qwen3.5-27B
  pretrained_asr: nvidia/canary-1b-flash

  pretrained_weights: True

  freeze_params:
    - "^llm\\..+$"
    - "^embed_tokens\\..+$"
    - "^perception\\.preprocessor\\..+$"
    - "^perception\\.encoder\\..+$"
  prevent_freeze_params: []

  prompt_format: qwen
  audio_locator_tag: "<|audioplaceholder|>"

  perception:
    target: nemo.collections.speechlm2.modules.perception.AudioPerceptionModule
    output_dim: 3584  # Qwen3.5-27B hidden dim
    modality_adapter:
      _target_: nemo.collections.speechlm2.modules.perception.IdentityConnector
      d_model: 1024  # FastConformer output dim

  optimizer:
    _target_: torch.optim.AdamW
    lr: 5e-4
    betas: [0.9, 0.98]
    weight_decay: 1e-3
    foreach: true

  lr_scheduler:
    _target_: nemo.core.optim.lr_scheduler.CosineAnnealing
    warmup_steps: 500
    min_lr: 1e-6
    max_steps: ${trainer.max_steps}

trainer:
  devices: [0]
  accelerator: gpu
  num_nodes: 1
  precision: bf16-true
  logger: False
  enable_checkpointing: False
  use_distributed_sampler: False
  max_steps: 67000  # ~1 epoch on 269K samples, batch 4
  limit_train_batches: 5000
  val_check_interval: ${trainer.limit_train_batches}
  limit_val_batches: 10
  log_every_n_steps: 10
  num_sanity_val_steps: 1
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  strategy:
    _target_: lightning.pytorch.strategies.DDPStrategy
    gradient_as_bucket_view: true
    find_unused_parameters: true

data:
  train_ds:
    sample_rate: 16000
    prompt_format: ${model.prompt_format}
    token_equivalent_duration: 0.08
    input_cfg:
      - type: lhotse_as_conversation
        cuts_path: /mnt/data/salm-duplex/manifests/full-960h/train.jsonl.gz
        audio_locator_tag: ${model.audio_locator_tag}
        tags:
          context: "Describe what you hear in this audio."
    seed: 42
    shuffle: true
    shard_seed: "randomized"
    num_workers: 2
    batch_size: 4

  validation_ds:
    prompt_format: ${model.prompt_format}
    token_equivalent_duration: 0.08
    datasets:
      librispeech_val:
        input_cfg:
          - type: lhotse_as_conversation
            cuts_path: /mnt/data/salm-duplex/manifests/full-960h/val.jsonl.gz
            audio_locator_tag: ${model.audio_locator_tag}
            tags:
              context: "Describe what you hear in this audio."
    sample_rate: 16000
    batch_size: 1
    seed: 42
    shard_seed: "randomized"

exp_manager:
  exp_dir: null
  explicit_log_dir: /mnt/data/training/salm-qwen27b/
  name: salm-qwen27b
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  use_datetime_version: true
  max_time_per_run: 00:12:00:00  # 12 hour limit

  resume_if_exists: true
  resume_ignore_no_checkpoint: true

  checkpoint_callback_params:
    filename: "{step}"
    monitor: val_loss
    mode: min
    every_n_train_steps: 5000
    every_n_epochs: 0
    save_top_k: 3
    always_save_nemo: false
    save_nemo_on_train_end: true
